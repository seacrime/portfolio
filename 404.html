<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="light-mode">
    <div class="container error-container">
        <div>
            <div class="error-code">404</div>
            <h1 data-en="Page not found" data-ru="Страница не найдена">Страница не найдена</h1>
            <p data-en="The page you are looking for does not exist or has been moved." data-ru="Страница, которую вы ищете, не существует или была перемещена.">
                Страница, которую вы ищете, не существует или была перемещена.
            </p>
            <a href="/portfolio/" class="btn btn-primary" style="margin-top: 2rem; display: inline-block;">
                <i class="fas fa-home"></i> <span data-en="Go to homepage" data-ru="На главную">На главную</span>
            </a>
        </div>
    </div>
    <script src="js/theme.js"></script>
    <script src="js/lang.js"></script>
</body>
</html>
